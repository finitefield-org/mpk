[workspace]
members = [
    "crates/mpk-core",
    "crates/mpk-cert",
    "crates/mpk-kernel",
    "crates/mpk-cli",
    "crates/mpk-vc",
    "crates/mpk-api",
    "crates/mpk-theory",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
