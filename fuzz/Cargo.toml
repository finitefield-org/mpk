[package]
name = "mpk-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mpk-cert = { path = "../crates/mpk-cert" }
mpk-cli = { path = "../crates/mpk-cli" }
mpk-kernel = { path = "../crates/mpk-kernel" }
mpk-theory = { path = "../crates/mpk-theory" }
mpk-vc = { path = "../crates/mpk-vc" }
serde_json = "1"

[[bin]]
name = "certificate_decoder"
path = "fuzz_targets/certificate_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "theory_certificates"
path = "fuzz_targets/theory_certificates.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vir_parser"
path = "fuzz_targets/vir_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_map_parser"
path = "fuzz_targets/source_map_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frontend_protocol"
path = "fuzz_targets/frontend_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_manifest_parser"
path = "fuzz_targets/source_manifest_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vc_parser"
path = "fuzz_targets/vc_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_v1"
path = "fuzz_targets/policy_v1.rs"
test = false
doc = false
bench = false

[workspace]
