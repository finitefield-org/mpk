title = "MPK repository secret scan"

[extend]
useDefault = false

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''\bAIza[0-9A-Za-z_-]{35}\b'''
tags = ["google", "api-key"]

[[rules]]
id = "google-oauth-access-token"
description = "Google OAuth access token"
regex = '''\bya29\.[0-9A-Za-z_-]{20,}\b'''
tags = ["google", "oauth"]

[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth refresh token"
regex = '''\b1//[0-9A-Za-z._~-]{20,}\b'''
tags = ["google", "oauth"]

[[rules]]
id = "private-key"
description = "Private key PEM marker"
regex = '''-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'''
tags = ["private-key"]

[[rules]]
id = "aws-access-key-id"
description = "AWS access key ID"
regex = '''\bAKIA[0-9A-Z]{16}\b'''
tags = ["aws"]

[[rules]]
id = "github-token"
description = "GitHub token"
regex = '''\bgh[pousr]_[A-Za-z0-9_]{20,}\b'''
tags = ["github"]

[[rules]]
id = "bearer-token"
description = "Bearer token value"
regex = '''(?i)\bBearer[ \t]+[0-9A-Za-z._~+/=-]{20,}'''
tags = ["token"]

[[rules]]
id = "credential-assignment"
description = "Credential-shaped assignment"
regex = '''(?i)\b(api[_-]?key|access[_-]?token|refresh[_-]?token|client[_-]?secret)\b[ \t]*[:=][ \t]*["']?[0-9A-Za-z._~+/=-]{20,}'''
tags = ["credential"]
