[package]
name = "mpk-cli"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = []
vertex-ai = ["dep:reqwest", "dep:wait-timeout"]

[dependencies]
mpk-api = { path = "../mpk-api" }
mpk-cert = { path = "../mpk-cert" }
mpk-core = { path = "../mpk-core" }
mpk-kernel = { path = "../mpk-kernel" }
mpk-theory = { path = "../mpk-theory" }
mpk-vc = { path = "../mpk-vc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
mpk-linux-sandbox = { path = "../mpk-linux-sandbox" }
rustix = { version = "1", features = ["fs", "mount", "process", "thread"] }

[build-dependencies]
mpk-vc = { path = "../mpk-vc" }

[dependencies.reqwest]
version = "0.13.4"
optional = true
default-features = false
features = ["blocking", "json", "rustls"]

[dependencies.wait-timeout]
version = "0.2.1"
optional = true

[dev-dependencies]
pulldown-cmark = "0.13"

[[bin]]
name = "mpk"
path = "src/main.rs"

[[test]]
name = "successor_atomic_cutover"
path = "tests/successor_atomic_cutover.rs"
harness = false

[[test]]
name = "java_frontend_runner"
path = "tests/java_frontend_runner.rs"
harness = false

[lints]
workspace = true
