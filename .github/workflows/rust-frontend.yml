name: Rust frontend release gate

# This privileged release workflow deliberately has no pull_request trigger.
# Only reviewed main bytes or a write-access-controlled manual ref may run it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-frontend:
    name: Frozen clean Linux gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out the selected trusted ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install host Rust used by the source-free workspace
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt

      - name: Install host Go used by the independent checker
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.23.0
          cache: false

      - name: Restore untrusted frozen-build cache
        id: rust-build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: release/build-input-cache/rust
          key: rust-build-inputs-${{ runner.os }}-${{ hashFiles('release/build-inputs/rust/build-inputs.json') }}

      - name: Materialize digest-pinned verification images
        env:
          GO_BUNDLE_IMAGE: docker.io/library/golang@sha256:ebd54034f076819b3054f155db53660ded951612bb4dfd277f933e62059e5d5a
          RUST_RUNTIME_IMAGE: docker.io/library/ubuntu@sha256:dca176c9663a7ba4c1f0e710986f5a25e672842963d95b960191e2d9f7185ebe
        run: |
          set -euo pipefail
          docker pull --platform=linux/amd64 "$GO_BUNDLE_IMAGE"
          docker pull --platform=linux/amd64 "$RUST_RUNTIME_IMAGE"
          docker image inspect "$GO_BUNDLE_IMAGE" >/dev/null
          docker image inspect "$RUST_RUNTIME_IMAGE" >/dev/null

      - name: Provision a cache miss from frozen identities
        if: steps.rust-build-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-release-bundles.sh --provision-build-inputs rust

      - name: Validate restored or provisioned bytes before use
        run: ./scripts/build-release-bundles.sh --check-build-inputs rust

      - name: Prefetch host-only test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          for module in go-tools/go2vir/go.mod go-tools/mpk-checker-ref/go.mod; do
            (cd "$(dirname "$module")" && GOTOOLCHAIN=local go mod download)
          done

      - name: Run the ordered gate in a networkless namespace
        shell: bash
        run: |
          set -euo pipefail
          runner_home="$HOME"
          rust_bin="$(dirname "$(rustup which cargo)")"
          go_bin="$(dirname "$(command -v go)")"
          go_root="$(go env GOROOT)"
          go_mod_cache="$(go env GOMODCACHE)"
          trusted_path="$rust_bin:$go_bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          # The checkout remains owned by the runner account. Trust only this
          # reviewed checkout for root Git operations inside the sanitized
          # namespace; never install a wildcard safe.directory exception.
          sudo /usr/bin/git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo /usr/bin/chown -R 0:0 \
            "$runner_home/.cargo" \
            "$runner_home/.rustup" \
            "$go_root" \
            "$go_mod_cache"
          sudo /usr/bin/unshare --net -- \
            /bin/bash -c '
              /usr/sbin/ip link set lo up
              exec /usr/bin/env -i \
                HOME=/root \
                CARGO_HOME="$1" \
                RUSTUP_HOME="$2" \
                GOROOT="$3" \
                GOMODCACHE="$4" \
                PATH="$5" \
                LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
                "$6"
            ' _ \
            "$runner_home/.cargo" \
            "$runner_home/.rustup" \
            "$go_root" \
            "$go_mod_cache" \
            "$trusted_path" \
            "$GITHUB_WORKSPACE/scripts/check-rust-frontend.sh"
