schema: mpk.package.v0
module: Example.Identity
imports:
  - module: Std.Bool
    export_hash: "MPK_EXPORT_HASH_PLACEHOLDER"
    certificate_hash: "MPK_CERT_HASH_PLACEHOLDER"
  - module: Std.Eq
    export_hash: "MPK_EXPORT_HASH_PLACEHOLDER"
    certificate_hash: "MPK_CERT_HASH_PLACEHOLDER"
  - module: Std.Program.Base
    export_hash: "MPK_EXPORT_HASH_PLACEHOLDER"
    certificate_hash: "MPK_CERT_HASH_PLACEHOLDER"
certificates:
  - path: generated/example.identity.mpcert
    module: Example.Identity
    expected_export_hash: "MPK_EXPORT_HASH_PLACEHOLDER"
    expected_axiom_report_hash: "MPK_AXIOM_REPORT_HASH_PLACEHOLDER"
    expected_certificate_hash: "MPK_CERT_HASH_PLACEHOLDER"
policy:
  checker_profile: mvp-strict
  allowed_axiom_profiles:
    - zero-axiom
  require_reference_checker: true
  require_source_free_check: true
